<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 ระบบบัญชีและประเมินอายุครุภัณฑ์โสตทัศนูปกรณ์ KLLC Master Hub</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --font-title: 'Outfit', 'Prompt', sans-serif;
      --font-body: 'Prompt', sans-serif;
      
      --bg-app: hsl(222, 25%, 8%);
      --bg-card: rgba(15, 23, 42, 0.55);
      --bg-card-hover: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(14, 165, 233, 0.4);
      
      --color-primary: hsl(199, 89%, 48%);
      --color-primary-glow: hsla(199, 89%, 48%, 0.2);
      --color-secondary: hsl(150, 84%, 37%);
      --color-secondary-glow: hsla(150, 84%, 37%, 0.15);
      --color-danger: hsl(355, 90%, 62%);
      --color-warning: hsl(38, 92%, 50%);
      
      --text-main: hsl(210, 20%, 92%);
      --text-muted: hsl(215, 15%, 65%);
      --text-active: hsl(0, 0%, 100%);
      
      --radius-m: 16px;
      --radius-s: 10px;
      --shadow-premium: 0 10px 30px rgba(0, 0, 0, 0.5);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 5% 10%, hsla(199, 89%, 48%, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 95% 90%, hsla(150, 84%, 37%, 0.06) 0%, transparent 35%);
      background-attachment: fixed;
      padding: 24px;
    }

    .container {
      max-width: 1450px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* --- HEADER --- */
    header.app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-m);
      box-shadow: var(--shadow-premium);
      position: relative;
      overflow: hidden;
    }

    header.app-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
    }

    .header-title h1 {
      font-family: var(--font-title);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-active);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    /* --- TABS --- */
    .tabs-wrapper {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: var(--radius-m);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow-x: auto;
      display: flex;
      gap: 6px;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-active);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--color-primary) 0%, hsl(199, 95%, 40%) 100%);
      color: var(--text-active);
      box-shadow: 0 4px 15px var(--color-primary-glow);
    }

    /* --- AGE ANALYSIS PANEL (OVER 10 YEARS BOXES) --- */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-m);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-premium);
      transition: var(--transition-smooth);
    }

    .summary-box:hover {
      transform: translateY(-2px);
      border-color: var(--border-glow);
    }

    .summary-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .summary-info h3 {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-info .val {
      font-family: var(--font-title);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-active);
      margin-top: 4px;
    }

    /* --- CARDS & PANELS --- */
    .panel {
      display: none;
      animation: fadeIn 0.3s ease forwards;
    }

    .panel.active {
      display: block;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-m);
      padding: 24px;
      box-shadow: var(--shadow-premium);
      transition: var(--transition-smooth);
      position: relative;
    }

    .card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 12px 36px rgba(14, 165, 233, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-active);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* --- SEARCH & CONTROL BAR --- */
    .controls-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      width: 100%;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
      flex-grow: 1;
      min-width: 250px;
    }

    .search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-s);
      background: rgba(10, 15, 30, 0.6);
      font-family: var(--font-body);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .search-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }

    .quick-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* --- BUTTONS --- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-s);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition-smooth);
      outline: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary) 0%, hsl(199, 95%, 40%) 100%);
      color: #fff;
      box-shadow: 0 4px 15px var(--color-primary-glow);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text-active);
    }

    .btn-danger {
      background: var(--color-danger);
      color: #fff;
    }
    .btn-danger:hover {
      background: hsl(355, 90% , 52%);
    }

    /* --- CHIPS & COUNTERS --- */
    .counter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* --- PREMIUM TABLE SYSTEM --- */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-s);
      border: 1px solid var(--border-color);
      background: rgba(10, 15, 30, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-active);
      font-weight: 600;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* --- STATUS BADGES --- */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: var(--transition-smooth);
    }
    .status-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }
    .status-working {
      background: rgba(63, 185, 80, 0.12);
      color: #3fb950;
      border-color: rgba(63, 185, 80, 0.25);
    }
    .status-broken {
      background: rgba(248, 81, 73, 0.12);
      color: #f85149;
      border-color: rgba(248, 81, 73, 0.25);
    }
    .status-maintenance {
      background: rgba(210, 153, 34, 0.12);
      color: #d29922;
      border-color: rgba(210, 153, 34, 0.25);
    }

    /* --- AGE BADGES --- */
    .age-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      border: 1px solid transparent;
    }
    .age-over10 {
      background: rgba(248, 81, 73, 0.15);
      color: #ff6b6b;
      border-color: rgba(248, 81, 73, 0.3);
    }
    .age-mid {
      background: rgba(217, 119, 6, 0.15);
      color: #f59e0b;
      border-color: rgba(217, 119, 6, 0.3);
    }
    .age-new {
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.25);
    }

    /* --- ROW TYPE STYLING --- */
    .row-category {
      background: rgba(14, 165, 233, 0.06);
      font-weight: bold;
    }
    .row-category td {
      color: var(--color-primary);
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(14, 165, 233, 0.2);
    }

    /* --- IMAGE CELLS --- */
    .image-cell-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thumbnail-preview {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      transition: var(--transition-smooth);
    }
    .thumbnail-preview:hover {
      transform: scale(1.15);
      border-color: var(--color-primary);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .btn-icon:hover {
      color: var(--text-active);
      border-color: var(--color-primary);
      background: var(--color-primary-glow);
    }

    /* --- MODAL DIALOGS --- */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }
    .modal-backdrop.show {
      display: flex;
    }

    .modal-card {
      background: hsl(222, 25%, 12%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-m);
      width: 100%;
      max-width: 600px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
    }
    .modal-close:hover {
      color: var(--text-active);
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-s);
      background: rgba(0,0,0,0.25);
      color: var(--text-main);
      font-family: var(--font-body);
      outline: none;
      transition: var(--transition-smooth);
    }
    .form-control:focus {
      border-color: var(--color-primary);
    }

    /* --- LIGHTBOX OVERLAY --- */
    .lightbox-backdrop {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1100;
    }
    .lightbox-backdrop.show {
      display: flex;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 2px solid rgba(255,255,255,0.1);
    }

    /* --- ANIMATIONS --- */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      header.app-header {
        flex-direction: column;
        text-align: center;
        gap: 16px;
      }
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .tabs-wrapper {
        padding: 4px;
      }
      .tab-btn {
        padding: 8px 14px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-title">
        <h1>📋 ระบบบัญชีและประเมินอายุครุภัณฑ์โสตทัศนูปกรณ์ KLLC Master Hub</h1>
        <p>ฝ่ายเทคโนโลยีและพื้นที่การเรียนรู้ • สำนักการเรียนรู้ตลอดชีวิต สจล.</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="exportFullJSON()"><i class="fa-solid fa-download"></i> ส่งออกข้อมูล (JSON)</button>
        <button class="btn btn-danger" onclick="resetToInitial()"><i class="fa-solid fa-rotate-left"></i> รีเซ็ตฐานข้อมูล</button>
      </div>
    </header>

    <!-- Visual Dashboard Metrics -->
    <section class="summary-grid" id="summaryGrid">
      <!-- Will be updated dynamically -->
    </section>

    <!-- Navigation Tabs -->
    <div class="tabs-wrapper" id="tabsContainer"></div>

    <!-- Active Panel Content -->
    <main class="panel active" id="mainPanel">
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="activeTitle"></div>
          <div class="header-actions" id="actionHeader">
            <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> เพิ่มครุภัณฑ์ใหม่</button>
          </div>
        </div>

        <div class="controls-row">
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="sheetSearch" class="search-input" placeholder="ค้นหาด้วย เลขครุภัณฑ์, ประเภท, หรือจัดเก็บ..." oninput="handleSearch()">
          </div>
          <div class="quick-filters">
            <button class="btn btn-secondary active-filter" id="f-all" onclick="setQuickFilter('all')">ทั้งหมด</button>
            <button class="btn btn-secondary" id="f-over10" onclick="setQuickFilter('over10')" style="color:#ff6b6b;"><i class="fa-solid fa-triangle-exclamation"></i> อายุเกิน 10 ปี</button>
            <button class="btn btn-secondary" id="f-broken" onclick="setQuickFilter('broken')" style="color:#f85149;"><i class="fa-solid fa-circle-xmark"></i> ชำรุด/เสีย</button>
            <button class="btn btn-secondary" id="f-working" onclick="setQuickFilter('working')" style="color:#3fb950;"><i class="fa-solid fa-circle-check"></i> ใช้ได้ปกติ</button>
          </div>
        </div>

        <div class="counter-bar" id="activeCounters"></div>

        <div class="table-container" id="activeTableContainer"></div>
      </div>
    </main>
  </div>

  <!-- EDIT / ADD MODAL -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="card-title" id="modalTitle"><i class="fa-solid fa-edit"></i> แก้ไขข้อมูลครุภัณฑ์</h2>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modalFormContent"></div>
      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="saveRecord()">บันทึกข้อมูล</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX OVERLAY -->
  <div class="lightbox-backdrop" id="lightbox" onclick="this.classList.remove('show')">
    <img id="lightboxImg" class="lightbox-img" src="" alt="ขยายใหญ่">
  </div>

    // IndexedDB Config
    const dbName = "KLLC_Survey_Standalone_DB";
    const storeName = "survey_records";
    const imageStoreName = "survey_images";

    // Initialize Database
    async function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
          if (!db.objectStoreNames.contains(imageStoreName)) {
            db.createObjectStore(imageStoreName);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function loadData() {
      try {
        const db = await initDB();
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        
        return new Promise((resolve) => {
          const req = store.get("kllc_records_data");
          req.onsuccess = () => {
            if (req.result) {
              currentDb = req.result;
            } else {
              currentDb = JSON.parse(JSON.stringify(INITIAL_DB));
            }
            resolve();
          };
        });
      } catch (err) {
        currentDb = JSON.parse(JSON.stringify(INITIAL_DB));
      }
    }

    async function persistData() {
      try {
        const db = await initDB();
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        store.put(currentDb, "kllc_records_data");
      } catch (err) {
        console.error("Failed to save to IndexedDB.", err);
      }
    }

      try {

        await new Promise((resolve, reject) => {
          const req = store.put(base64Data, recordKey);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      } catch (err) {
        console.error("Failed to save image.", err);
      }
    }

      try {

        const tx = db.transaction(imageStoreName, "readonly");
        const store = tx.objectStore(imageStoreName);
        return new Promise((resolve) => {
          const req = store.get(recordKey);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch (err) {
        return null;
      }
    }

    // Delete Image from DB
    async function deleteImage(recordKey) {
      try {
        const db = await initDB();
        const tx = db.transaction(imageStoreName, "readwrite");
        const store = tx.objectStore(imageStoreName);
        store.delete(recordKey);
      } catch (err) {}
    }

    // Dynamic Asset Age Calculator based on Thai B.E. Format
    function getAssetAgeInfo(assetId) {
      if (!assetId) return null;
      const match = assetId.match(/(\d{2})/);
      if (match) {
        const yrShort = parseInt(match[1]);
        if (yrShort > 0) {
          let beYear = (yrShort >= 30 && yrShort <= 99) ? (2500 + yrShort) : (2500 + yrShort);
          if (yrShort < 30) {
            beYear = 2500 + yrShort;
          }
          const currentBeYear = 2569;
          const age = currentBeYear - beYear;
          return {
            beYear: beYear,
            age: age
          };
        }
      }
      return null;
    }

    // Render Active Sheet Panel
    async function renderActiveSheet() {
      const sheet = currentDb[activeSheet];
      if (!sheet) return;
      
      document.getElementById("activeTitle").innerHTML = `<i class="fa-solid fa-folder-open"></i> ${activeSheet}`;
      
      const searchTerm = document.getElementById("sheetSearch").value.trim().toLowerCase();
      const headers = sheet.headers;
      
      let rows = sheet.data;
      rows = rows.filter(r => r && (r._type === "category" || typeof r === "object"));
      
      if (searchTerm) {
        rows = rows.filter(r => {
          if (r._type === "category") return false;
          return Object.values(r).some(v => String(v).toLowerCase().includes(searchTerm));
        });
      }
      
      if (activeFilter === "over10") {
        rows = rows.filter(r => {
          if (r._type === "category") return false;
          const ageInfo = getAssetAgeInfo(r["เลขครุภัณฑ์"]);
          return ageInfo && ageInfo.age >= 10;
        });
      } else if (activeFilter === "broken") {
        rows = rows.filter(r => {
          if (r._type === "category") return false;
          return Object.keys(r).some(k => {
            if (k === "ใช้งานไม่ได้" || k === "ใช้งานไม่ได้" || k === "ใช้ไม่ได้") {
              return r[k] === "ใช้งานไม่ได้" || r[k] === "0" || r[k] === "ชำรุด";
            }
            return false;
          }) || r["ใช้งานไม่ได้"] === "ใช้งานไม่ได้" || r["ใช้ได้"] === "ใช้งานไม่ได้";
        });
      } else if (activeFilter === "working") {
        rows = rows.filter(r => {
          if (r._type === "category") return false;
          return Object.keys(r).some(k => {
            if (k === "ใช้งานได้" || k === "ใช้ได้") {
              return r[k] === "ใช้งานได้" || r[k] === "ใช้ได้" || r[k] === "1" || r[k] === "OK";
            }
            return false;
          });
        });
      }
      
      calculateGlobalStats();
      
      const container = document.getElementById("activeTableContainer");
      if (rows.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fa-regular fa-face-frown"></i> ไม่พบข้อมูลที่ตรงกับเงื่อนไข</div>`;
        return;
      }
      
      let tableHtml = `<table><thead><tr>`;
      headers.forEach(h => {
        tableHtml += `<th>${h}</th>`;
      });
      tableHtml += `<th>อายุใช้งาน</th>`;
      tableHtml += `<th>ภาพถ่าย</th>`;
      tableHtml += `<th>จัดการ</th>`;
      tableHtml += `</tr></thead><tbody>`;
      
      for (let rIdx = 0; rIdx < rows.length; rIdx++) {
        const row = rows[rIdx];
        
        if (row._type === "category") {
          tableHtml += `<tr class="row-category"><td colspan="${headers.length + 3}">${row.title}</td></tr>`;
          continue;
        }
        
        tableHtml += `<tr>`;
        headers.forEach(h => {
          let val = row[h] || "";
          
          if (h === "ใช้งานได้" || h === "ใช้ได้" || h === "ใช้งานไม่ได้" || h.includes("สถานะ")) {
            let working = (val === "ใช้งานได้" || val === "ใช้ได้" || val === "1" || val === "OK");
            let broken = (val === "ใช้งานไม่ได้" || val === "0" || val === "ชำรุด");
            if (working) {
              tableHtml += `<td><span class="status-badge status-working" onclick="toggleRowStatus(${rIdx}, '${h}', '${val}')" title="คลิกเพื่อสลับสถานะ"><i class="fa-solid fa-circle-check"></i> ใช้งานได้</span></td>`;
            } else if (broken) {

        let ageHtml = `<td>—</td>`;
        if (ageInfo) {

            <button class="btn btn-danger" style="padding: 4px 8px;" onclick="deleteRecord(${rIdx})"><i class="fa-solid fa-trash"></i></button>
          </div>

    // Calculate Global Metrics for Dashboard Boxes
    function calculateGlobalStats() {
      let totalCount = 0;
      let workingCount = 0;
      let brokenCount = 0;
      let over10Count = 0;
      
      Object.keys(currentDb).forEach(sheetName => {
        const rows = currentDb[sheetName].data || [];
        rows.forEach(r => {
          if (!r || r._type === "category") return;
          totalCount++;
          
          const ageInfo = getAssetAgeInfo(r["เลขครุภัณฑ์"]);
          if (ageInfo && ageInfo.age >= 10) {
            over10Count++;
          }
          
          Object.keys(r).forEach(k => {
            if (k === "ใช้งานได้" || k === "ใช้ได้") {
              if (r[k] === "ใช้งานได้" || r[k] === "ใช้ได้" || r[k] === "1" || r[k] === "OK") workingCount++;
              if (r[k] === "ใช้งานไม่ได้" || r[k] === "0" || r[k] === "ชำรุด") brokenCount++;
            }
          });
        });
      });
      
      const grid = document.getElementById("summaryGrid");
      grid.innerHTML = `
        <div class="summary-box">
          <div class="summary-icon" style="background:var(--color-primary-glow); color:var(--color-primary);"><i class="fa-solid fa-boxes-stacked"></i></div>
          <div class="summary-info">
            <h3>ครุภัณฑ์ทั้งหมด</h3>
            <div class="val">${totalCount} รายการ</div>
          </div>
        </div>
        <div class="summary-box" style="border-color: rgba(239, 68, 68, 0.35);">
          <div class="summary-icon" style="background:rgba(239,68,68,0.15); color:hsl(355, 90%, 62%);"><i class="fa-solid fa-triangle-exclamation"></i></div>
          <div class="summary-info">
            <h3>หมดอายุ (เกิน 10 ปี)</h3>
            <div class="val" style="color:#ff6b6b;">${over10Count} รายการ</div>
          </div>
        </div>
        <div class="summary-box" style="border-color: rgba(217, 119, 6, 0.3);">
          <div class="summary-icon" style="background:rgba(217,119,6,0.15); color:#f59e0b;"><i class="fa-solid fa-circle-exmark"></i></div>
          <div class="summary-info">
            <h3>ชำรุด (ต้องซ่อมแซม)</h3>
            <div class="val" style="color:#f59e0b;">${brokenCount} รายการ</div>
          </div>
        </div>
        <div class="summary-box" style="border-color: rgba(16, 185, 129, 0.3);">
          <div class="summary-icon" style="background:rgba(16,185,129,0.12); color:#10b981;"><i class="fa-solid fa-circle-check"></i></div>
          <div class="summary-info">
            <h3>พร้อมใช้งานปกติ</h3>
            <div class="val" style="color:#10b981;">${workingCount} รายการ</div>
          </div>
        </div>
      `;
    }

    // Dynamic counters bar
    function updateStats(rows) {
      const bar = document.getElementById("activeCounters");
      bar.innerHTML = "";
      
      const normalRows = rows.filter(r => r && r._type !== "category");
      const total = normalRows.length;
      
      let working = 0;
      let broken = 0;
      let over10 = 0;
      
      normalRows.forEach(r => {
        Object.keys(r).forEach(k => {
          if (k === "ใช้งานได้" || k === "ใช้ได้") {
            if (r[k] === "ใช้งานได้" || r[k] === "ใช้ได้" || r[k] === "1" || r[k] === "OK") working++;
            if (r[k] === "ใช้งานไม่ได้" || r[k] === "0" || r[k] === "ชำรุด") broken++;
          }
        });
        
        const ageInfo = getAssetAgeInfo(r["เลขครุภัณฑ์"]);
        if (ageInfo && ageInfo.age >= 10) over10++;
      });
      
      let html = `
        <span class="chip"><i class="fa-solid fa-table-list"></i> ในหน้านี้: ${total} แถว</span>
      `;
      if (working > 0) {
        html += `<span class="chip" style="color:#3fb950; border-color:rgba(63, 185, 80, 0.35);"><i class="fa-solid fa-circle-check"></i> ใช้ได้: ${working}</span>`;
      }
      if (broken > 0) {
        html += `<span class="chip" style="color:#f85149; border-color:rgba(248, 81, 73, 0.35);"><i class="fa-solid fa-circle-xmark"></i> ชำรุด: ${broken}</span>`;
      }
      if (over10 > 0) {
        html += `<span class="chip" style="color:#ff6b6b; border-color:rgba(248, 81, 73, 0.35);"><i class="fa-solid fa-triangle-exclamation"></i> เสื่อมสภาพ (>10 ปี): ${over10}</span>`;
      }
      bar.innerHTML = html;
    }

    // IMAGE UPLOAD IMPLEMENTATION

      document.getElementById(`file_${recordKey}`).click();

    function uploadRowImage(e, recordKey) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = async function(evt) {
        const base64 = evt.target.result;
        await saveImage(recordKey, base64);
        renderActiveSheet();
      };
      reader.readAsDataURL(file);
    }

    async function saveRecord() {
      const sheet = currentDb[activeSheet];
      const headers = sheet.headers;
      
      let updatedRecord = {};
      headers.forEach(h => {
        updatedRecord[h] = document.getElementById(`form_${h}`).value;
      });
      
      if (isNewRecord) {
        sheet.data.push(updatedRecord);
      } else {
        sheet.data[currentEditIndex] = updatedRecord;
      }
      
      await persistData();
      closeModal();
      renderActiveSheet();
    }

    async function deleteRecord(rIdx) {
      if (confirm("คุณแน่ใจว่าต้องการลบแถวครุภัณฑ์นี้ใช่หรือไม่?")) {
        const sheet = currentDb[activeSheet];
        const record = sheet.data[rIdx];
        const recordKey = `${activeSheet}_${record["ลำดับ"] || rIdx}_${record["เลขครุภัณฑ์"] || ""}`;
        await deleteImage(recordKey);
        
        sheet.data.splice(rIdx, 1);
        await persistData();
        renderActiveSheet();
      }
    }

    async function resetToInitial() {
      if (confirm("คำเตือน: คุณต้องการลบการแก้ไขทั้งหมดและรีเซ็ตค่าเป็นค่าดั้งเดิมจากสเปรดชีตใช่หรือไม่?")) {
        currentDb = JSON.parse(JSON.stringify(INITIAL_DB));
        await persistData();
        
        // Clear images
        const db = await initDB();
        const tx = db.transaction(imageStoreName, "readwrite");
        tx.objectStore(imageStoreName).clear();
        
        selectTab(Object.keys(currentDb)[0]);
      }
    }

    // Start App
    window.addEventListener("DOMContentLoaded", async () => {
      await loadData();
      activeSheet = Object.keys(currentDb)[0] || "";
      renderTabs();
      if (activeSheet) {
        selectTab(activeSheet);
      }
    });
  </script>
</body>
</html>
